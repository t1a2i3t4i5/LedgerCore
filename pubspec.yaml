name: ledger_app
description: 家計簿アプリ（端末内完結・オフライン版）
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.7.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  intl: ^0.19.0
  drift: ^2.20.0
  drift_flutter: ^0.2.0
  fl_chart: ^1.2.0
  # 操作ログの書き込み先を解決するために使う（lib/logging/）。
  # どちらも drift_flutter 経由で既に pubspec.lock に入っていた推移的依存を
  # 直接依存へ昇格しただけで、新しく取ってくるパッケージではない。
  # ネットワークは絡まない（このアプリに通信を伴う実装は無い）
  path_provider: ^2.1.6
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.20.0
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
  # 実行時にネットワークから取得しないため、ttf を同梱する。
  # サブセット化しない: カテゴリ名などがユーザー入力なので、収録漏れを防ぐ。
  # ウェイトは実際に要求されるものだけを置く。日本語フォントは 1 ウェイト
  # 2〜4MB あるので、太字は ZenKakuGothicNew に一本化する（#106）。
  fonts:
    - family: ZenMaruGothic
      fonts:
        - asset: assets/fonts/ZenMaruGothic-Regular.ttf
    - family: ZenKakuGothicNew
      fonts:
        - asset: assets/fonts/ZenKakuGothicNew-Bold.ttf
          weight: 700
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit-SemiBold.ttf
          weight: 600
  assets:
    - assets/fonts/OFL-ZenMaruGothic.txt
    - assets/fonts/OFL-ZenKakuGothicNew.txt
    - assets/fonts/OFL-Outfit.txt
